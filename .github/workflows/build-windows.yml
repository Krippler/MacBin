# Reusable workflow: build Windows binaries for the calling repository on a
# CI Runner Farm runner whose Dockerfile.github starts with
#   FROM ghcr.io/krippler/wmbin:runner-base-<version>
#
#   jobs:
#     windows:
#       uses: Krippler/WMBin/.github/workflows/build-windows.yml@v0.3.0
#       permissions:
#         contents: write        # only needed to attach zips to releases
#       with:
#         arch: both
name: Build Windows binaries

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner labels (default any self-hosted runner)
        type: string
        default: '["self-hosted"]'
      arch:
        type: string
        default: x86_64
      build-system:
        type: string
        default: auto
      build-cmd:
        type: string
        default: ""
      subdir:
        type: string
        default: ""
      static:
        type: boolean
        default: false
      cmake-args:
        type: string
        default: ""
      meson-args:
        type: string
        default: ""
      configure-args:
        type: string
        default: ""
      cargo-args:
        type: string
        default: ""
      artifacts:
        type: string
        default: ""
      env:
        description: Further winbin-build settings, one KEY=VALUE per line
        type: string
        default: ""
      artifact-name:
        type: string
        default: windows-binaries
      release:
        description: Attach the zips to the GitHub release when run for a tag
        type: boolean
        default: true
    outputs:
      output-dir:
        value: ${{ jobs.windows.outputs.output-dir }}

jobs:
  windows:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    outputs:
      output-dir: ${{ steps.winbin.outputs.output-dir }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - id: winbin
        uses: Krippler/WMBin/windows@v0.3.0
        with:
          arch: ${{ inputs.arch }}
          build-system: ${{ inputs.build-system }}
          build-cmd: ${{ inputs.build-cmd }}
          subdir: ${{ inputs.subdir }}
          static: ${{ inputs.static }}
          cmake-args: ${{ inputs.cmake-args }}
          meson-args: ${{ inputs.meson-args }}
          configure-args: ${{ inputs.configure-args }}
          cargo-args: ${{ inputs.cargo-args }}
          artifacts: ${{ inputs.artifacts }}
          env: ${{ inputs.env }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ steps.winbin.outputs.zips }}
          if-no-files-found: error

      - name: Attach to release
        if: inputs.release && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.winbin.outputs.zips }}
