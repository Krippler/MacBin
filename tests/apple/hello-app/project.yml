# XcodeGen spec for the build-apple test app (one SwiftUI target for iOS and macOS).
name: HelloApp
options:
  bundleIdPrefix: com.example.macbin
  deploymentTarget:
    iOS: "16.0"
    macOS: "13.0"
targets:
  HelloApp:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Sources]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme: {}
